        <p><strong>Profile:</strong> 베이스 윤창현. 덕원예술고등학교 졸업(실기공로상), 중앙대학교 학사(3등 졸업), 독일 뤼베크 국립음악대학교 석사(만장일치 만점), 오스트리아 잘츠부르크 모차르테움 대학교 최고연주자과정 만점 수료. 한국·독일·오스트리아에서 다수 오페라/오페레타 출연(Dulcamara, Don Alfonso, Figaro, Sarastro 등). 2022/23시즌 오스트리아 린츠 주립극장 오페라 스튜디오 최초의 동양인 베이스 단원, 2024/25시즌부터 린츠 주립극장 전속 베이스 솔리스트로 활동. 사사: 이재환, 공병우, 전태현, Manuela Uhl, Andreas Macco, Iris Vermillion, Robert Holzer.</p>
