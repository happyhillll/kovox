        <p><strong>Profile:</strong> 1983년 한국 출생 테너. 연세대학교(사사: 김관동 전 연세대 교수) 졸업 후 이탈리아 유학, 프랑스 국립 오페라 스튜디오(CNIPAL), 웨일즈 국제 성악아카데미(WIAV) 석사 졸업, 데니스 오닐 사사. 한국 독일가곡콩쿠르 2위, Ottavio Ziino 국제콩쿠르 본선, Giulietta Simionato 국제콩쿠르 2위, Les Azuriales 2위, Wilhelm Stehnhammar 특별상, Toulouse 국제콩쿠르 특별상. 영국 로얄 필하모닉과 협연, 로얄 오페라 하우스 예트파거 영 아티스트, 2010~2012 코벤트 가든에서 활동(로디리고/피델리오/라 트라비아타 가스톤 등). BBC Proms 재연, 로얄 오페라 실황 DVD. 로시니 전문. 현재 서울미래예술교육원 성악과 교수, 캘리포니아 예술대학 성악과 출강.</p>
