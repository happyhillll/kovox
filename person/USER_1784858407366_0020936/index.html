        <p><strong>Profile:</strong> 베이스 박기현은 가천대학교 음악대학 성악과를 졸업한 후 독일 로스톡 국립음대, 드레스덴 국립음대, 이태리 로마 아레나 아카데미아에서 수학했다. 체코 드보르작 국제 콩쿠르에서 한국인 최초로 우승하며 최고표현상·국립극장상·모차르트상을 수상했고, 독일 여러 국제 성악 콩쿠르에서도 입상했다. 2005년부터 헨델 페스티발에 매년 초대되어 공연하고 있으며 독일 MDR 방송 오케스트라와 음반을 출시했다. 2002년부터 현재까지 독일 할레 오페라하우스 종신 베이스 주역 성악가로 활동 중이며, 90여 편의 오페라에 출연해 1800회 이상 공연했다.</p>
