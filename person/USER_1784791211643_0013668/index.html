        <p><strong>Profile:</strong> 소프라노 김나연 (Nayun Lea Kim). 예원학교, 서울예술고등학교, 서울대학교 음악대학 성악과(전액장학) 졸업. 독일 뉘른베르크 국립음대 석사(콘서트과/오페라스튜디오과), 마인츠 국립음대 Konzertexamen 오페라·콘서트 최고점수 졸업. 독일 바그너 협회 바이로이트 장학생, DAAD 장학생. 뉘른베르크 주립극장 오페라스튜디오·오페라앙상블 역임, 마인츠 주립극장 용에스앙상블, 겔젠키르헨 레비어 음악극장 등 출연. 서울시오페라단·광주시립오페라단 협연. 현재 중앙대·상명대 성악전공 실기강사.</p>
