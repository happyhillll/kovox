        <p><strong>Profile:</strong> 따스하고 유연한 음색의 소프라노. 경북예술고, 대구가톨릭대학교 성악과 및 대학원, 이탈리아 니콜리니 국립음악원(Conservatorio &#x27;Giuseppe Nicolini&#x27;) 성악(Canto Lirico) 비엔니오 졸업, 꼬모 마리아노 코멘세 아카데미 합창지휘·뮤지컬 디플로마, 베르첼리 시립음악원(Scuola Comunale &#x27;F.A. Vallotti&#x27;) 오페라·최고연주자(Alto perfezionamento) 과정 수료. 피에로 카푸칠리 국제 콩쿠르 파이널리스트, 베르첼리 시립극장 일 트로바토레 &#x27;레오노라&#x27;로 데뷔. 레오 누치(Leo Nucci) 마스터클래스, 로디 극장 갈라 오페라 푸치니, 투란도트 &#x27;류(Liù)&#x27;, 라보엠 &#x27;미미(Mimì)&#x27;. 현재 경북예술고등학교 출강.</p>
