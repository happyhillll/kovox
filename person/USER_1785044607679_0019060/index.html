        <p><strong>Profile:</strong> 맑고 청아한 음색과 세련된 음악적 해석을 지닌 소프라노 윤서현은 선화예술학교와 선화예술고등학교를 거쳐 서울대학교 음악대학 성악과에 실기우수 장학생으로 입학. 이후 밀라노 베르디 국립음악원(Conservatorio di Musica &quot;Giuseppe Verdi&quot; di Milano) 비엔뇨(Biennio) 과정 수료. 선화예고 실기우수자 오케스트라 협연, 음악신문사 콩쿠르 1위, 서울시립대학교 콩쿠르 전체 1위, 성정음악콩쿠르 2위, 음악춘추 콩쿠르 3위, 수리음악콩쿠르 2위, 이화·경향 콩쿠르 3위 등 수상. 이탈리아 Bari시 Castellana Grotte 단독 독창회 및 오르간·소프라노 리사이틀 개최. Michele Porcelli, Carlo Maria Arosio 사사. 현재 계원예술중학교 출강.</p>
