        <p><strong>Profile:</strong> 소프라노 이예원은 한국예술종합학교에서 성악과 예술사 및 가곡·오라토리오 전공 예술전문사를 졸업 후, 현재 독일 쾰른 국립음악대학교에서 Prof. Brigitte Lindner 지도 아래 리트·콘체르트 전공 석사 과정 재학 중. 2021년 제84회 조선일보 신인음악회로 데뷔, 한예종 오페라 프로젝트 Purcell Dido and Aeneas의 Belinda역 출연, 2023년 Seongsan Art Hall &#x27;All That Classic&#x27; 지역 선정 아티스트. 2024년 독일 NRW 음악대학 협업 앙상블 소프라노 솔리스트, 2025년 쾰른 G. Mahler Symphonie Nr.4 솔리스트, Brahms Ein deutsches Requiem 등. 2025년 Internationaler Musikwettbewerb Köln 파이널리스트.</p>
