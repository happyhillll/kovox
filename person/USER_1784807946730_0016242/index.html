        <p><strong>Profile:</strong> 소프라노 심지연(Beatrice Sim). 상명여고·백석예술대학·강서대 성악과 졸업, 가천대 대학원. 한국SGI 푸른빛합창단 발성코치. 2009 크누아홀 &#x27;스페인 가곡의 밤&#x27; 데뷔, 오페라 라 트라비아타·안나 볼레나(주역) 등. 2015 이탈리아 밀라노 유학(도니제티 아카데미아 비엔뇨 디플로마). 서울심포니오케스트라 합창단·푸르나메 합창단·피스싱어즈 솔리스트/기획. 2024 오클랜드 세계합창대회 은상, Arte Creativa 국제콩쿠르 성악 준대상.</p>
